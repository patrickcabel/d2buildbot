# D2 Build Maker — Oracle Always Free
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      # Used by the app for OAuth redirect + CORS (must match public HTTPS URL).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      BUNGIE_REDIRECT_URI: ${PUBLIC_BASE_URL}/api/auth/callback
      FRONTEND_ORIGIN: ${PUBLIC_BASE_URL}
    volumes:
      # Persist SQLite (tokens, manifest, references) across restarts.
      - app-data:/app/backend/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
