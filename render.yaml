# Free-tier Render Blueprint: https://dashboard.render.com/blueprints
# After first deploy, set your Bungie app Redirect URL to:
#   https://YOUR-SERVICE.onrender.com/api/auth/callback
services:
  - type: web
    name: d2buildbot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BUNGIE_API_KEY
        sync: false
      - key: BUNGIE_CLIENT_ID
        sync: false
      - key: BUNGIE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
